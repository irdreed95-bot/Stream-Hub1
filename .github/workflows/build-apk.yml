name: Build StreamVault APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/streamvault run build

      - name: Prepare Capacitor Android
        env:
          STREAMVAULT_WEB_URL: ${{ secrets.STREAMVAULT_WEB_URL }}
        run: |
          cd artifacts/streamvault
          rm -f capacitor.config.ts capacitor.config.json
          if [ -z "$STREAMVAULT_WEB_URL" ]; then
            echo "STREAMVAULT_WEB_URL GitHub secret is required."
            exit 1
          fi
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.sarad.app",
            "appName": "Sarad",
            "webDir": "dist/public",
            "server": {
              "url": "$STREAMVAULT_WEB_URL",
              "cleartext": false
            }
          }
          EOF
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Generate Icons and Splash
        run: |
          cd artifacts/streamvault
          if [ -f "icon.png" ]; then
            pnpm exec capacitor-assets generate --android
          fi

      - name: Build Android APK
        run: |
          cd artifacts/streamvault/android
          ./gradlew assembleDebug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-APK
          path: artifacts/streamvault/android/app/build/outputs/apk/debug/app-debug.apk
